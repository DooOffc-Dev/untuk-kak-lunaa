        body {background: black;font-family:"Sriracha",serif;overflow:hidden}
        
        #bodyblur{opacity:.4;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);transition:all 1s ease;}

        #wallpaper{width:100%;height:100%;transform:scale(2);transition:all 1.3s ease;}

	   .overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,1);z-index:9999;}
	   .cover{color:white;margin-top:-180px;display:flex;flex-direction:column;justify-content:center;align-items:center}

	   .lovein{font-size:50px;display:flex;align-items:center;justify-content:center;transition:all .3s ease;}

      #main-stiker{display:flex}
      .container{position:relative;display:block;width:80%;max-width:550px;min-height:100px;max-height:350px;overflow:auto;background-color:rgba(0,0,0,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border:2px solid rgba(255,255,255,0.8);border-radius:25px;opacity:0;transform:scale(0);margin:auto;padding:20px 25px;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.4);}
	  .container h3{font-size:16px;font-weight:bold;color:#fff;text-align:left;}
	  .container p{font-size:15px;color:#fff;text-align:left;line-height:1.6;}
	  .titleC{font-size:16px!important;margin-bottom:14px;font-family:"Itim",cursive;color:#ffe4e6;}
	  .messageC{font-family:"Itim",cursive;color:#ffffff;}
	  .fontAlt{font-family:'Satisfy',cursive;font-size:21px;font-weight:700}
	  .textBg{background:#fff;border-radius:12px;padding:4px 6px;text-shadow:none;color:red}
	  .opamuncul{position:relative;opacity:1;transform:scale(1);transition:all 0.7s ease;}
	  .opahidden{opacity:0;transform:scale(0);transition:all 0.7s ease;}
	  .hidden,#linkmp3{display:none;}
	  .semihidden{transform:scale(0);opacity:0;}

	#scontainer{width:80%;margin:20px auto;min-height:650px;margin-top:150px;color:#000}@media screen and (max-width:400px){#scontainer{width:100%;margin:50% auto;min-height:800px}}.wrapper{position:fixed}.box div{position:fixed;width:60px;height:60px;background-color:transparent;border:6px solid rgba(255,255,255,.6);border-radius:50%;z-index:-10}.box div:nth-child(1){top:12%;left:42%;animation:animate 10s linear infinite}.box div:nth-child(2){top:70%;left:50%;animation:animate 7s linear infinite}.box div:nth-child(3){top:17%;left:6%;animation:animate 9s linear infinite}.box div:nth-child(4){top:20%;left:60%;animation:animate 10s linear infinite}.box div:nth-child(5){top:67%;left:10%;animation:animate 6s linear infinite}.box div:nth-child(6){top:80%;left:70%;animation:animate 12s linear infinite}.box div:nth-child(7){top:60%;left:80%;animation:animate 15s linear infinite}.box div:nth-child(8){top:32%;left:25%;animation:animate 16s linear infinite}.box div:nth-child(9){top:90%;left:25%;animation:animate 9s linear infinite}.box div:nth-child(10){top:20%;left:80%;animation:animate 5s linear infinite}@keyframes animate{0%{transform:scale(0) translateY(0) rotate(0);opacity:.8}100%{transform:scale(1.3) translateY(-90px) rotate(360deg);opacity:0}}
	
	.click-effect {
	  position: fixed;
	  width: 8px;
	  height: 8px;
	  border-radius: 50%;
	  background: rgba(255, 255, 255, 0.5);
	  pointer-events: none;
	  transform: translate(-50%, -50%) scale(1);
	  animation: click-animation 0.3s ease-out forwards;
	}
	
	@keyframes click-animation {
	  0% {
	    transform: translate(-50%, -50%) scale(1);
	    opacity: 1;
	  }
	  100% {
	    transform: translate(-50%, -50%) scale(2);
	    opacity: 0;
	  }
	}
    </style>

  <body>
    <div class="overlay">
      <div class="cover">
        <p>Coode By Doo×Triaa</p>
        <div class="awalan">

              <path d="M9.27542857,0.714285714 C14.0030476,0.714285714 17.836381,4.54666667 17.836381,9.2752381 C17.836381,14.0038095 14.0030476,17.8361905 9.27542857,17.8361905 C4.54685714,17.8361905 0.71447619,14.0038095 0.71447619,9.2752381 C0.71447619,4.54666667 4.54685714,0.714285714 9.27542857,0.714285714 Z"></path>
              <path d="M17.8989524,16.487619 C18.678,16.487619 19.3094286,17.12 19.3094286,17.8980952 C19.3094286,18.6780952 18.678,19.3095238 17.8989524,19.3095238 C17.1199048,19.3095238 16.4875238,18.6780952 16.4875238,17.8980952 C16.4875238,17.12 17.1199048,16.487619 17.8989524,16.487619 Z"></path>
            </g>
          </svg>
          <label style="font-size:16px">Untuk Kak Lunaa🥹🫶</label>

    <div id="bodyblur">
      <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhqjeQ7NlN92_dwtxYNCtLFpPe9lMt_zffq06EPVGF53aqoeBoy3wNq4j6BSPtc8f_ciXlX07xs1mSjgaSpXZUwpYXg2JJxl4D1iVjpdspfHiScLSgqfKTJIHtH4OmpG8Gk1Br8sByutqxjx-s1H-gY8LQCLjWPWyqQ6SsJFac-IGfZq05gxRp3CemyatUy/s1200/1000322477.jpg" id="wallpaper" />

    <!--  doo/doo.mp3 -->

    <div class="stiker">
      <img id="main-stiker" src="https://htmlku.com/0/panda/pusn.gif" />
      <img id="stikerAlt1" src="https://htmlku.com/0/panda/muah.gif" />

    <div class="container" id="container">
      <p class="titleC">
        <b>hayy kak aku buatin kata " ini buat kk luna yang udah hebat dan bertahan sampai sejauh ini,,🤏🥀</b>
      </p>
      <p class="messageC"></p>

    <div id="scontainer">
      <div class="swrapper">
        <div class="box">
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>

    <script>
      document.addEventListener("click", function (e) {
        const circle = document.createElement("div");
        circle.classList.add("click-effect");
        circle.style.left = `${e.pageX}px`;
        circle.style.top = `${e.pageY}px`;
        document.body.appendChild(circle);
        circle.addEventListener("animationend", () => {
          circle.remove();
        });
      });

    const overlay = document.querySelector('.overlay');
    const cover = document.querySelector('.cover');
    const container = document.getElementById('container');
    const titleC = document.querySelector('.titleC');
    const messageC = document.querySelector('.messageC');
    const stiker = document.querySelector('.stiker');
    const mainStiker = document.querySelector('#main-stiker');
    const wallpaper = document.getElementById('wallpaper');
    const linkmp3 = document.getElementById('linkmp3');
    
    audio = new Audio('' + linkmp3.src);

    document.querySelector(".awalan").onclick = async function() {
        audio.play();

        overlay.style="opacity:0;transition:all .6s ease";
        cover.style="transform:scale(0);opacity:0;transition:all .6s ease";
        setTimeout(function(){
            overlay.style.display="none";
            wallpaper.style="transform: scale(1)";
            
            container.classList.remove('hidden');
            container.classList.add('opamuncul');
            stiker.classList.add('opamuncul');
            katanimasi();
        }, 300);
    }
    
    vjudul = document.querySelector('.titleC').innerHTML;
    titleC.innerHTML = "";
    messageC.innerHTML = "";
    
    function katanimasi(){
		new TypeIt(".titleC", {
	    strings: [vjudul],
	    startDelay: 250,
	    speed: 50,
	    cursor: true,
	    afterComplete: function(){      
	      	titleC.innerHTML = vjudul;
	        setTimeout(() => {katanimasiAlts()}, 500);
	    },}).go();
	}

    function katanimasiAlts(){
        new TypeIt(".messageC", {
        strings: [
            "aku liat perjuangan kak luna dari awal,nga mudah,tapi kak luna lewatin satu-satu kak luna hebat banget bangga banget aku sama kak luna,",
            "<br><br>masalah datang buat nguji,bukan buat ngalahin,dan kak lun udah buktiin kalo kak luna pemenangnya salut aku sama km kak,",
            "<br><br>kak luna selalu jatuh berkalih - kalih tapi kak luna selalu bangkit itu namanya hebat kak,bangga banget aku sama kak luna , yang nga nyerah walupun banyak orang - buat jatuhin kak luna🤏🥀🤍",
            "<br><br>selamat juga buat kak luna udh di titik semester 5,nga kerasa kak luna udh sejauh ini,ayoo kak tinggal sedikit lagi, menuju ke 3 semester lagi,kak luna akan resmi jadi sarjana,",
            "<br><br>semoga setiap air mata kak luna dan usaha kak luna selama ini di bayar lunas sama hal- hal baik,kak luna udh berjuang se jauh ini lanjutkan,adek mu ini selalu support kak luna dari jarak jauh🤍😍",
            "<br><br>dan ibu kak luna juga hebat banget,dari cara dia ngajarin kak luna kuat, sabar,dan sayang sama orang.pantes anaknya juga sekeren kak luna😍",
            "<br><br>aku tau kak kehilangan bapak itu sakit banget.tpi lihat kamu sekarang,bisa tetap berdiri dan melewati semuanya, pasti bapak kak luna bangga banget dari atas sana liat anaknya se kuat kak luna,",
            "<br><br>meskipun bapak kak luna udah nga ada, semangat dan didikan beliu masih hidup di kak luna, semoga Allah tempatkan bapak kak luna di surga aminn,",
            "<br><br>dan buat kak luna maksih udh jadi kk yang baik dan yng selalu dengar adik mu ini curhat yaaa,kalo kak luna capek call me adik mu ini, selalu welcome jika km butuh tempat curhat dan cerita 🤍😍"
        ],
        startDelay: 400,
        speed: 65,
        cursor: true,
        breakLines: true,
        waitUntilVisible: true,
        afterStep: function(instance) {
            if (instance.is('completed')) {
                setTimeout(function() {
                    instance.next();
                }, 500);
            }
        },
        afterComplete: function(){      
            document.querySelector(".ti-cursor").style.display = "none";
            setTimeout(function() {
                clearInterval(scrollInterval);
            }, 1000);
            setTimeout(() => {
                stikerHidden();
                setTimeout(() => {
                   mainStiker.src = document.getElementById('stikerAlt1').src;
                 }, 300);
             }, 100);
        },}).go();
    }
    
    function stikerHidden(){
    	stiker.style="transform:scale(0);opacity:0;";
        setTimeout(function(){stiker.style="transform:scale(1.1);opacity:1;";}, 300);
    }
    
    function autoScroll() {container.scrollTop += 1;} 
    const scrollInterval = setInterval(autoScroll, 50);
    </script>
